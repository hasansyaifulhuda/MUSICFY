# ==============================================================================
# Nginx Reverse Proxy Configuration for MusicFY
# Optimized for Audio Streaming (HTTP Range, zero-buffering), WebSockets & Umami
# Replace DOMAIN_PLACEHOLDER with your actual domain (e.g. shanz.my.id)
# ==============================================================================

# Upstream definitions
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream umami_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Client upload limits (e.g., audio upload / covers)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Gzip Compression (excluding audio formats to conserve CPU)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Next.js Static Asset Caching
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://nextjs_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Audio Streaming Route - Zero-Buffering & HTTP Range Seeking
    # --------------------------------------------------------------------------
    location ~* ^/api/(stream|download)/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # Disable buffering so audio chunks stream in real-time without delay
        proxy_buffering off;
        proxy_cache off;
        proxy_ignore_client_abort on;

        # Extended timeouts for long audio tracks or album downloads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Pass HTTP Range and Host headers
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow partial content status 206
        chunked_transfer_encoding on;
    }

    # --------------------------------------------------------------------------
    # Umami Analytics Proxy (Bypasses Adblockers & Subpath Route)
    # --------------------------------------------------------------------------
    # Serve tracking script directly from root URL (e.g., https://yourdomain.com/analytics.js)
    location = /analytics.js {
        proxy_pass http://umami_upstream/script.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # Umami Web Dashboard
    location /analytics/ {
        proxy_pass http://umami_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Main Next.js Web Application
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
