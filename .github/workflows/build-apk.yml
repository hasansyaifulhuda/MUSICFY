name: Build Android APK (Debug & Production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web Application
      run: npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Production Signed APK
      run: |
        bash scripts/build-apk.sh --skip-web
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'musicfy_ci_secret_2026' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'musicfy_ci_secret_2026' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'musicfy' }}

    - name: Upload Production Release APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicFY-Release-APK
        path: |
          release/*.apk
          release/checksums.txt
